version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: faang-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: faang
      MYSQL_USER: faang
      MYSQL_PASSWORD: faangpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed:/docker-entrypoint-initdb.d/seed
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "faang", "-pfaangpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - faang-network

  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faang-backend
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/faang?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: faang
      SPRING_DATASOURCE_PASSWORD: faangpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: false
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - faang-network
    restart: unless-stopped

  frontend-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faang-frontend
    depends_on:
      - backend-service
    environment:
      VITE_API_URL: http://backend-service:8080
    ports:
      - "5173:5173"
    networks:
      - faang-network
    restart: unless-stopped

networks:
  faang-network:
    driver: bridge

volumes:
  mysql-data:

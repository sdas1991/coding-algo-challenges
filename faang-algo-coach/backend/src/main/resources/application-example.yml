# Copy this file to application-local.yml and configure your local settings
# application-local.yml is gitignored and won't be committed

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/faang_algo_coach?createDatabaseIfNotExist=true
    username: your_username
    password: your_password

  jpa:
    hibernate:
      ddl-auto: update  # use 'create' for fresh database, 'update' for existing
    show-sql: true

server:
  port: 8080

logging:
  level:
    com.faang.coach: DEBUG
